function headP(){return `<div class="hd"><img src="${LOGO}" alt=""><p class="a">PROVINCIA DI PISA</p><p class="b">SETTORE VIABILITÀ, TRASPORTI E PROTEZIONE CIVILE</p><p class="c">${titoloDoc()}</p><p class="d">MODELLO ADDETTO · rev ${String(D.rev||'0').padStart(2,'0')}</p></div>`;}
function ptab(t){
  const items=riepRows(t);
  const body=items.map((r,i)=>`<tr>${i===0?`<td class="nm" rowspan="${items.length+1}">${esc(D.addetto)}</td>`:''}<td class="dt">${r[0]}</td><td class="dt">${r[1]}</td></tr>`).join('')+`<tr class="tot"><td>TOTALE ORE</td><td>${hm(totale(t))}</td></tr>`;
  return `<table class="rt2"><thead><tr><th>NOMINATIVO DIPENDENTE</th><th>GIORNI</th><th>ORE</th></tr></thead><tbody>${body}</tbody></table>`;}
const nomeCognome=n=>{const r=RUBRICA.find(x=>x[0]+' '+x[1]===n);return r?r[1]+' '+r[0]:n;};
const firma=(l,n,corsivo)=>`<div>${l}</div><div><b>${esc(n)}</b></div><div class="fi">Firma<i>${corsivo?`<b class="sig">${esc(nomeCognome(n))}</b>`:''}</i></div>`;
async function stampa(){
  const t=turnoInfo();
  const righe=R.length?R.map(r=>`<tr>${COLS.map(([k])=>`<td>${esc(k==='data'?fd(r.data):r[k])}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="12" class="vuoto">Nessun intervento</td></tr>`;
  let p=$('#print');if(!p){p=document.createElement('div');p.id='print';document.body.appendChild(p);}
  p.innerHTML=`<section class="pp p1">${headP()}<p class="pm"><b>Registro dell’addetto</b> · ${esc(D.addetto)} · turno dal ${p2(t.a)}/${p2(t.m)}/${t.y} al ${p2(t.b)}/${p2(t.m)}/${t.y}</p>
   <table class="pt"><thead><tr>${COLS.map(c=>`<th>${c[1]}</th>`).join('')}</tr></thead><tbody>${righe}</tbody></table></section>
   <section class="pp p2">${headP()}
   <p class="rp">Il sottoscritto dipendente <b>${esc(D.addetto)}</b> dichiara sotto la propria responsabilità di aver prestato il Servizio di Reperibilità nei giorni e per le ore sotto indicate.</p>${ptab('rep')}
   <p class="rp">${T2}</p>${ptab('str')}
   <div class="sg">${firma('L’ADDETTO',D.addetto,true)}${firma('IL COORDINATORE',D.coordinatore)}${firma('IL SUPERVISORE',D.supervisore)}</div></section>`;
  try{await document.fonts.load("500 19pt Caveat","Aa");}catch(e){}
  await Promise.all([...p.querySelectorAll('img')].map(i=>i.decode?i.decode().catch(()=>{}):0));
  const old=document.title;document.title=fname();
  window.addEventListener('afterprint',()=>{document.title=old;},{once:true});
  window.print();
}

function buildWB(){
  const X=XLSX,t=turnoInfo();
  const wsR=X.utils.aoa_to_sheet([COLS.map(c=>c[1])].concat(R.map(r=>COLS.map(([k])=>k==='data'?fd(r.data):(r[k]??'')))));
  wsR['!cols']=[8,12,12,24,8,8,30,14,40,12,12,30].map(w=>({wch:w}));
  const A=[['PROVINCIA DI PISA'],['SETTORE VIABILITÀ, TRASPORTI E PROTEZIONE CIVILE'],[titoloDoc()],['Modello addetto · rev '+String(D.rev||'0').padStart(2,'0')],[],
    [T1.replace('dipendente','dipendente '+D.addetto)],['Nominativo dipendente','Giorni','Ore']];
  const blocco=k=>{const rows=riepRows(k);rows.forEach((r,i)=>A.push([i===0?D.addetto:'',r[0],r[1]]));A.push(['','TOTALE ORE',hm(totale(k))]);};
  blocco('rep');A.push([],[T2],['Nominativo dipendente','Giorni','Ore']);blocco('str');
  A.push([],['L’addetto',D.addetto,'','Firma'],['Il Coordinatore',D.coordinatore,'','Firma'],['Il Supervisore',D.supervisore,'','Firma']);
  const wsS=X.utils.aoa_to_sheet(A);wsS['!cols']=[{wch:26},{wch:16},{wch:10},{wch:12}];
  const J={v:'V05.10',role:'addetto',D:{addetto:D.addetto,coordinatore:D.coordinatore,supervisore:D.supervisore,anno:D.anno,mese:D.mese,turno:D.turno,rev:D.rev},
    S:{rep:S.rep,str:S.str,del:{rep:[...S.del.rep],str:[...S.del.str]}}};
  const wb=X.utils.book_new();
  X.utils.book_append_sheet(wb,wsR,'Registro');X.utils.book_append_sheet(wb,wsS,'Riepilogo');
  X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet([[JSON.stringify(J)]]),'_dati');
  wb.Workbook={Sheets:[{},{},{Hidden:1}]};
  return wb;
}

function emlBlob(to,subj,body,fn,bytes){
  const bd='----=_Rep'+Date.now(),u8=new TextEncoder();
  const L=[to?'To: '+to:'','Subject: =?UTF-8?B?'+b64(u8.encode(subj))+'?=','X-Unsent: 1','MIME-Version: 1.0',`Content-Type: multipart/mixed; boundary="${bd}"`,'',
   '--'+bd,'Content-Type: text/plain; charset=UTF-8','Content-Transfer-Encoding: base64','',wrap(b64(u8.encode(body))),
   '--'+bd,`Content-Type: ${XMIME}; name="${fn}"`,'Content-Transfer-Encoding: base64',`Content-Disposition: attachment; filename="${fn}"`,'',wrap(b64(bytes)),'--'+bd+'--',''].filter((x,i)=>i>0||x);
  return new Blob([L.join('\r\n')],{type:'message/rfc822'});
}
async function inviaMail(){
  if(!haXlsx())return;
  const to=emailOf(D.coordinatore),subj=oggetto(),fn=fname()+'.xlsx',bytes=new Uint8Array(xlsxBytes());
  const body=`Buongiorno,\nin allegato il report di reperibilità dell’addetto ${D.addetto}.\n\nCordiali saluti`;
  const file=new File([bytes],fn,{type:XMIME});
  if(/Android|iPhone|iPad/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:subj,text:(to?'Destinatario: '+to+'\n\n':'')+body});return;}catch(e){if(e.name==='AbortError')return;}
  }
  scarica(emlBlob(to,subj,body,fn,bytes),fname()+'.eml');
  alert('Ho scaricato una bozza di mail (.eml) con l’Excel già allegato: aprila con il tuo programma di posta e invia.'+(to?'':'\nAttenzione: nella rubrica non c’è l’email del coordinatore.'));
}
/* ---- Caricamento ---- */
function cv(k,v){
  if(v==null)return '';
  if(k==='data'){if(typeof v==='number')return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
    const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(v).trim());return m?`${m[3]}-${p2(m[2])}-${p2(m[1])}`:String(v);}
  if(k==='dur'&&typeof v==='number')return hm(Math.round(v*1440));
  if(k==='oc'||k==='arr'||k==='of'){if(typeof v==='number'){const m=Math.round(v*1440);return p2(Math.floor(m/60)%24)+':'+p2(m%60);}
    const x=/^(\d{1,2}):(\d{2})/.exec(String(v));return x?p2(x[1])+':'+x[2]:String(v);}
  return String(v);
}
async function parseReport(f){
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),d=wb.Sheets['_dati'],g=wb.Sheets['Registro'];
  if(!d||!g)throw 0;
  const J=JSON.parse(d.A1.v);if(J.role!=='addetto')throw 1;
  const rows=XLSX.utils.sheet_to_json(g,{header:1,raw:true,defval:''}).slice(1).filter(a=>a.some(c=>c!==''));
  const Rr=rows.map(a=>{const r={man:false};COLS.forEach(([k],j)=>{r[k]=cv(k,a[j]);});r.man=r.dur!==''&&r.dur!==autoDur(r);return r;});
  return {D:J.D,S:J.S,R:Rr};
}
async function caricaFile(f){
  if(!haXlsx())return;
  try{const x=await parseReport(f);
    Object.assign(D,x.D);S.rep=x.S.rep||{};S.str=x.S.str||{};S.del.rep=new Set(x.S.del.rep||[]);S.del.str=new Set(x.S.del.str||[]);
    R.length=0;x.R.forEach(r=>R.push(r));st.step=1;render();
  }catch(e){alert('File non riconosciuto: carica un report dell’addetto esportato da questo programma.');}
}

function giorniRep(x){const Dx=x.D,y=+Dx.anno,m=+Dx.mese,last=new Date(y,m,0).getDate(),a=[1,7,13,19,25][Dx.turno-1],b=Dx.turno<5?a+5:last,F=festivi(y),out=[];

/* ---- Controlli del registro del coordinatore (V05.10) ---- */
function checksC(){
  const t=turnoInfo(),[a,b]=isoTurno(),out=[],eff=B=>B===1439?1440:B;
  const add=(i,l,m,fix)=>out.push({i,lvl:l,msg:m,fix});
  RC.forEach((r,i)=>{
    if(!r.data)add(i,'w','Data mancante.');
    else if(r.data<a||r.data>b)add(i,'w',`La data è fuori dal turno (dal ${p2(t.a)} al ${p2(t.b)}/${p2(t.m)}/${t.y}).`);
    const dm=r.dur===''?null:pm(r.dur);
    if(r.dur==='')add(i,'w','Impegno totale mancante.');
    else if(dm===null)add(i,'w','Impegno totale in formato non valido (usa h:mm).');
    const A=toMin(r.oc),B=toMin(r.of);
    if(A==null||B==null){add(i,'w','Ora di chiamata o orario di chiusura mancante.');return;}
    if(B<A){add(i,'b','L’intervento attraversa la mezzanotte: va diviso in due righe.',1);return;}
    if(B===A)add(i,'w','L’orario di chiusura coincide con l’ora di chiamata.');
    if(dm!==null&&B>A&&dm>eff(B)-A)add(i,'w',`L’impegno totale (${r.dur}) è maggiore dell’intervallo tra chiamata e chiusura (${hm(eff(B)-A)}).`);
    const ar=toMin(r.arr);
    if(ar!=null&&ar<A)add(i,'w','L’orario di arrivo è precedente all’ora di chiamata.');
    else if(ar!=null&&ar>eff(B))add(i,'w','L’orario di arrivo è successivo alla chiusura.');
    if(/^\d{4}-\d\d-\d\d$/.test(r.data)){
      const dt=new Date(r.data+'T00:00:00'),dw=dt.getDay();
      if(dw>=1&&dw<=5&&!festivi(dt.getFullYear()).has(r.data.slice(5))){
        const f=(dw===2||dw===4)?{c:[540,1020],x:[[450,540],[1020,1110]],t:'9:00–17:00',tx:'7:30–9:00 o 17:00–18:30'}:{c:[540,810],x:[[450,540],[810,900]],t:'9:00–13:30',tx:'7:30–9:00 o 13:30–15:00'};
        const ov=(x,y)=>A<y&&B>x;
        /* impegno 0:00 = intervento svolto solo dall'addetto: nessun controllo sull'orario; impegno vuoto o non valido: niente errore bloccante */
        if(dm===0){}
        else if(ov(f.c[0],f.c[1])){if(dm!==null)add(i,'b',`L’intervento cade nell’orario di lavoro certo (${f.t}): il coordinatore non può segnare ore di impegno in questa fascia. Se l’intervento è stato svolto solo dall’addetto, inserisci 0:00.`);}
        else if(f.x.some(([x,y])=>ov(x,y)))add(i,'w',`L’intervento cade nella fascia di flessibilità dell’orario di lavoro (${f.tx}): verifica.`);
      }}
  });
  for(let j=0;j<RC.length;j++)for(let i=0;i<j;i++){
    const x=RC[i],y=RC[j],Ai=toMin(x.oc),Bi=toMin(x.of),Aj=toMin(y.oc),Bj=toMin(y.of);
    if(x.data&&x.data===y.data&&[Ai,Bi,Aj,Bj].every(v=>v!=null)&&Ai<Bi&&Aj<Bj&&Ai<Bj&&Aj<Bi)add(j,'w',`Si sovrappone all’intervento della riga ${i+1}.`);}
  /* incrocio con i report degli addetti (±15 minuti) */
  const near=(p,q)=>p==null||q==null||Math.abs(p-q)<=15,matched=new Map(),lista=ad=>(ad.rep&&ad.rep.R)||[];
  RC.forEach((r,i)=>{if(!r.data)return;
    (r.add||[]).forEach(n=>{const ad=C.addetti.find(x=>x.nome===n);if(!ad||!ad.rep)return;
      const mm=matched.get(n)||new Set();matched.set(n,mm);
      const cand=lista(ad).map((x,k)=>({x,k})).filter(o=>o.x.data===r.data);
      if(!cand.length){add(i,'w',`${sn(n)}: nel suo report non risulta nessun intervento del ${fmtD(r.data)}.`);return;}
      const df=(p,q)=>p==null||q==null?0:Math.abs(p-q),sc=o=>df(toMin(r.arr),toMin(o.x.arr))+df(toMin(r.of),toMin(o.x.of));
      const ok=cand.filter(o=>near(toMin(r.arr),toMin(o.x.arr))&&near(toMin(r.of),toMin(o.x.of)));
      if(ok.length)ok.forEach(o=>mm.add(o.k));
      else{const best=cand.sort((p,q)=>sc(p)-sc(q))[0];mm.add(best.k);
        add(i,'w',`${sn(n)}: gli orari non coincidono con il suo report (arrivo ${best.x.arr||'—'}, fine ${best.x.of||'—'}): scostamento oltre 15 minuti.`);}
    });});
  C.addetti.forEach(ad=>{if(!ad.rep||!okNome(ad.nome))return;const mm=matched.get(ad.nome)||new Set();
    lista(ad).forEach((x,k)=>{if(!x.data||x.data<a||x.data>b||mm.has(k))return;
      add(-1,'w',`${sn(ad.nome)}: l’intervento del ${fmtD(x.data)} (${x.oc||'—'}–${x.of||'—'}) è nel suo report ma non risulta in nessuna riga del registro che lo indichi tra gli addetti coinvolti.`);});});
  return out.sort((p,q)=>(p.lvl==='b'?0:1)-(q.lvl==='b'?0:1)||(p.i<0?9999:p.i)-(q.i<0?9999:q.i));
}

function checksS(){
  const t=turnoInfo(),[a,b]=isoTurno(),out=[],eff=B=>B===1439?1440:B;
  const add=(i,l,m,fix)=>out.push({i,lvl:l,msg:m,fix});
  RS.forEach((r,i)=>{
    if(!r.data)add(i,'w','Data mancante.');
    else if(r.data<a||r.data>b)add(i,'w',`La data è fuori dal turno (dal ${p2(t.a)} al ${p2(t.b)}/${p2(t.m)}/${t.y}).`);
    const dm=r.dur===''?null:pm(r.dur);
    if(r.dur==='')add(i,'w','Impegno totale mancante.');
    else if(dm===null)add(i,'w','Impegno totale in formato non valido (usa h:mm).');
    if(r.sd==='Sì'&&!r.arr)add(i,'w','Sopralluogo diretto indicato, ma manca l’orario di arrivo sul posto.');
    if(r.sd==='No'&&r.arr)add(i,'w','È indicato un orario di arrivo, ma il sopralluogo non è diretto.');
    const A=toMin(r.oc),B=toMin(r.of);
    if(A==null||B==null){add(i,'w','Ora di chiamata o orario di chiusura mancante.');return;}
    if(B<A){add(i,'b','L’intervento attraversa la mezzanotte: va diviso in due righe.',1);return;}
    if(B===A)add(i,'w','L’orario di chiusura coincide con l’ora di chiamata.');
    if(dm!==null&&B>A&&dm>eff(B)-A)add(i,'w',`L’impegno totale (${r.dur}) è maggiore dell’intervallo tra chiamata e chiusura (${hm(eff(B)-A)}).`);
    const ar=toMin(r.arr);
    if(ar!=null&&ar<A)add(i,'w','L’orario di arrivo è precedente all’ora di chiamata.');
    else if(ar!=null&&ar>eff(B))add(i,'w','L’orario di arrivo è successivo alla chiusura.');
    if(/^\d{4}-\d\d-\d\d$/.test(r.data)){
      const dt=new Date(r.data+'T00:00:00'),dw=dt.getDay();
      if(dw>=1&&dw<=5&&!festivi(dt.getFullYear()).has(r.data.slice(5))){
        const f=(dw===2||dw===4)?{c:[540,1020],x:[[450,540],[1020,1110]],t:'9:00–17:00',tx:'7:30–9:00 o 17:00–18:30'}:{c:[540,810],x:[[450,540],[810,900]],t:'9:00–13:30',tx:'7:30–9:00 o 13:30–15:00'};
        const ov=(x,y)=>A<y&&B>x;
        if(dm===0){}
        else if(ov(f.c[0],f.c[1])){if(dm!==null)add(i,'b',`L’intervento cade nell’orario di lavoro certo (${f.t}): il supervisore non può segnare ore di impegno in questa fascia. Se non ha svolto attività, inserisci 0:00.`);}
        else if(f.x.some(([x,y])=>ov(x,y)))add(i,'w',`L’intervento cade nella fascia di flessibilità dell’orario di lavoro (${f.tx}): verifica.`);
      }}
  });
  for(let j=0;j<RS.length;j++)for(let i=0;i<j;i++){
    const x=RS[i],y=RS[j],Ai=toMin(x.oc),Bi=toMin(x.of),Aj=toMin(y.oc),Bj=toMin(y.of);
    if(x.data&&x.data===y.data&&[Ai,Bi,Aj,Bj].every(v=>v!=null)&&Ai<Bi&&Aj<Bj&&Ai<Bj&&Aj<Bi)add(j,'w',`Si sovrappone all’intervento della riga ${i+1}.`);}
  /* incrocio con il registro del coordinatore (±15 minuti) */
  const cr=SV.coord?(SV.coord.RC||[]):null,matched=new Set();
  if(cr){
    RS.forEach((r,i)=>{if(!r.data)return;const A=toMin(r.oc),B=toMin(r.of);
      const cand=cr.map((x,k)=>({x,k})).filter(o=>o.x.data===r.data&&o.x.ss==='Sì');
      if(!cand.length){add(i,'w',`Nel registro del coordinatore non risulta nessun sopralluogo del supervisore del ${fmtD(r.data)}.`);return;}
      if(A==null||B==null||B<A)return;
      const ok=cand.filter(o=>{const x=toMin(o.x.oc),y=toMin(o.x.of);return x==null||y==null||(A<=y+15&&B>=x-15);});
      if(ok.length)ok.forEach(o=>matched.add(o.k));
      else{cand.forEach(o=>matched.add(o.k));add(i,'w',`Gli orari non coincidono con il sopralluogo indicato dal coordinatore (${cand.map(o=>(o.x.oc||'—')+'–'+(o.x.of||'—')).join(', ')}): scostamento oltre 15 minuti.`);}
    });
    cr.forEach((x,k)=>{if(x.ss==='Sì'&&x.data&&x.data>=a&&x.data<=b&&!matched.has(k))add(-1,'w',`Il coordinatore ha indicato un sopralluogo del supervisore (n° ${x.n||'—'} del ${fmtD(x.data)}, ${x.oc||'—'}–${x.of||'—'}) che non risulta nel registro del supervisore.`);});
  }
  return out.sort((p,q)=>(p.lvl==='b'?0:1)-(q.lvl==='b'?0:1)||(p.i<0?9999:p.i)-(q.i<0?9999:q.i));
}

function giorniCoordJ(J){const Dx=J.D,y=+Dx.anno,m=+Dx.mese,last=new Date(y,m,0).getDate(),a=[1,7,13,19,25][Dx.turno-1],b=Dx.turno<5?a+5:last,F=festivi(y),out=[];

    const s=(J.RC||[]).filter(r=>r.data===iso).reduce((t,r)=>t+(pm(r.dur||'')||0),0);
    out.push({iso,lab:`${p2(d)}/${p2(m)}/${y}`,rep:1440-s-ord,st:s});}

function formSup(){const t=turnoInfo(),T=['1 – 6','7 – 12','13 – 18','19 – 24','25 – '+t.last];

async function svCarica(f){
  if(/\.pdf$/i.test(f.name)){alert('Il report del coordinatore va caricato in formato Excel (.xlsx): il PDF non contiene dati leggibili dal programma.');return;}
  if(!haXlsx())return;
  try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),d=wb.Sheets['_dati'];if(!d)throw 0;
    const ks=Object.keys(d).filter(k=>/^A\d+$/.test(k)).sort((p,q)=>parseInt(p.slice(1))-parseInt(q.slice(1)));
    const J=JSON.parse(ks.map(k=>d[k].v).join(''));if(J.role!=='coordinatore')throw 1;
    SV.coord=J;SV.file=f.name;SV.visto='';
    SV.addetti=(J.C||[]).filter(a=>a.nome||a.rep).map(a=>({nome:a.nome||'',file:a.file||'',rep:a.rep||null,vistoC:a.visto||'',visto:''}));
    if(!okNome(D.coordinatore)&&okNome(J.D.coordinatore))D.coordinatore=J.D.coordinatore;
    if(!okNome(D.supervisore)&&okNome(J.D.supervisore))D.supervisore=J.D.supervisore;
    render();
  }catch(e){alert('File non riconosciuto: carica un report del coordinatore esportato da questo programma.');}}

/* ---- Salvataggio automatico della bozza (V05.10) ---- */
const BZ_RUOLI=['addetto','coordinatore','supervisore'],BZ_NOME={addetto:'Addetto',coordinatore:'Coordinatore',supervisore:'Supervisore'};
const bzKey=k=>'rep_bozza_'+k;
function bzLeggi(k){try{const s=localStorage.getItem(bzKey(k));return s?JSON.parse(s):null;}catch(e){return null;}}
function bzElimina(k){try{localStorage.removeItem(bzKey(k));}catch(e){}}
const delArr=o=>({rep:[...o.rep],str:[...o.str]});
function bzSnapshot(k){
  if(k==='addetto')return {D:{...D},R,S:{rep:S.rep,str:S.str,del:delArr(S.del)}};
  if(k==='supervisore')return {D:{...D},SV,RS,SSC:{rep:SSC.rep,str:SSC.str,del:delArr(SSC.del)}};

const bzHaDati=k=>k==='supervisore'?!!(SV.coord||RS.length):k==='addetto'?!!(D.addetto||R.length):!!(D.coordinatore||RC.length||C.addetti.some(a=>a.nome||a.rep));

function bzSalva(){
  const k=st.role;if(st.view!=='role'||!BZ_RUOLI.includes(k)||!bzHaDati(k))return;
  const snap=bzSnapshot(k),key=JSON.stringify(snap)+'|'+st.step;if(bzUltimo[k]===key)return;
  try{localStorage.setItem(bzKey(k),JSON.stringify({t:Date.now(),step:st.step,data:snap}));bzUltimo[k]=key;bzOk=true;
    const d=new Date(),b=$('#bz');if(b)b.textContent=`Bozza salvata automaticamente alle ${p2(d.getHours())}:${p2(d.getMinutes())} · i dati restano sul dispositivo`;
  }catch(e){bzOk=false;const b=$('#bz');if(b)b.textContent='Salvataggio automatico non disponibile in questo browser';}

function bzRipristina(k){const b=bzLeggi(k);if(!b||!b.data)return;const x=b.data;
  try{
    Object.assign(D,x.D);
    if(k==='addetto'){R.length=0;x.R.forEach(r=>R.push(r));S.rep=x.S.rep||{};S.str=x.S.str||{};S.del.rep=new Set(x.S.del.rep||[]);S.del.str=new Set(x.S.del.str||[]);}

    else{RC.length=0;x.RC.forEach(r=>RC.push({...r,add:[...(r.add||[])]}));SC.rep=x.SC.rep||{};SC.str=x.SC.str||{};SC.del.rep=new Set(x.SC.del.rep||[]);SC.del.str=new Set(x.SC.del.str||[]);
      C.addetti.length=0;(x.C||[]).forEach(a=>C.addetti.push({nome:a.nome||'',file:a.file||'',visto:a.visto||'',rep:a.rep||null}));
      if(!C.addetti.length)C.addetti.push({nome:'',rep:null,file:'',visto:''});}

function bzAzzera(k){
  if(k==='supervisore'){SV.coord=null;SV.file='';SV.visto='';SV.addetti=[];RS.length=0;SSC.rep={};SSC.str={};SSC.del.rep=new Set();SSC.del.str=new Set();D.supervisore='';D.rev='00';delete bzUltimo[k];return;}
  if(k==='addetto'){R.length=0;S.rep={};S.str={};S.del.rep=new Set();S.del.str=new Set();D.addetto='';}
  else{RC.length=0;SC.rep={};SC.str={};SC.del.rep=new Set();SC.del.str=new Set();C.addetti.length=0;C.addetti.push({nome:'',rep:null,file:'',visto:''});D.coordinatore='';}
